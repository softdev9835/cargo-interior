<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="tdGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5DC" />
      <stop offset="25%" stop-color="#E8C365" />
      <stop offset="65%" stop-color="#C59B28" />
      <stop offset="100%" stop-color="#F2D27E" />
    </linearGradient>
    <linearGradient id="tdDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161A" />
      <stop offset="100%" stop-color="#08080A" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#D4AF37" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Luxury Obsidian Rounded Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#tdDark)" stroke="url(#tdGold)" stroke-width="1.8" />
  
  <!-- Subtle Interior Framing Accent -->
  <rect x="5" y="5" width="54" height="54" rx="11" fill="none" stroke="url(#tdGold)" stroke-width="0.6" stroke-opacity="0.35" stroke-dasharray="3 3" />

  <!-- Bold Architectural 'T' Letterform -->
  <path d="M 12 17 H 31 V 23 H 24.5 V 47 H 18.5 V 23 H 12 Z"
        fill="url(#tdGold)"
        filter="url(#goldGlow)" />

  <!-- Bold Architectural 'D' Letterform -->
  <path fill-rule="evenodd" clip-rule="evenodd"
        d="M 33 17 H 43.5 C 48.5 17 52 20.5 52 26 V 38 C 52 43.5 48.5 47 43.5 47 H 33 V 17 Z M 39 23 V 41 H 43 C 45.5 41 46.5 39.5 46.5 37 V 27 C 46.5 24.5 45.5 23 43 23 H 39 Z"
        fill="url(#tdGold)"
        filter="url(#goldGlow)" />

  <!-- Architectural Diamond Accent -->
  <polygon points="32,11.5 34,9.5 36,11.5 34,13.5" fill="url(#tdGold)" filter="url(#goldGlow)" />
</svg>
