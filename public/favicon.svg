<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cargoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEABB" />
      <stop offset="30%" stop-color="#E2B755" />
      <stop offset="65%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#FCEABB" />
    </linearGradient>
    <linearGradient id="cargoDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#D4AF37" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Dark Obsidian Base with smooth luxury squircle -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#cargoDark)" stroke="url(#cargoGold)" stroke-width="1.8" />
  
  <!-- Subtle Interior Framing Accent -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="12" fill="none" stroke="url(#cargoGold)" stroke-width="0.6" stroke-opacity="0.4" stroke-dasharray="3 3" />

  <!-- Architectural 'C' Monogram for Cargo Interiors -->
  <path d="M42 22 C39 17 34 15.5 29.5 15.5 C20.5 15.5 14.5 22.5 14.5 32 C14.5 41.5 20.5 48.5 29.5 48.5 C34 48.5 39 47 42 42 L37 38.5 C35 41.5 32.5 42.5 29.5 42.5 C23.5 42.5 20.5 37.5 20.5 32 C20.5 26.5 23.5 21.5 29.5 21.5 C32.5 21.5 35 22.5 37 25.5 Z" 
        fill="url(#cargoGold)" 
        filter="url(#goldGlow)" />

  <!-- Top and Bottom Architectural Serifs -->
  <rect x="36" y="15.5" width="7" height="6.5" rx="1.5" fill="url(#cargoGold)" />
  <rect x="36" y="42" width="7" height="6.5" rx="1.5" fill="url(#cargoGold)" />

  <!-- Center Interior Diamond Accent -->
  <polygon points="46,32 49.5,28.5 53,32 49.5,35.5" fill="url(#cargoGold)" filter="url(#goldGlow)" />
</svg>
